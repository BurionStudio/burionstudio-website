name: Worker behavior tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Worker and agent-facing files
        run: node --test tests/worker.test.mjs
