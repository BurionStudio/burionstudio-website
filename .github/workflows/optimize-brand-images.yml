name: Optimize brand images

on:
  push:
    paths:
      - 'assets/brand/*.png'
      - 'assets/brand/*.jpg'
      - '.github/workflows/optimize-brand-images.yml'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save sharp

      - name: Generate optimized WebP assets
        run: |
          node <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');

          const files = [
            ['assets/brand/burion-hero-lion.jpg', 'assets/brand/burion-hero-lion.webp', 'hero'],
            ['assets/brand/burion-logo-horizontal.png', 'assets/brand/burion-logo-horizontal.webp', 'logo'],
            ['assets/brand/burion-logo-gold.png', 'assets/brand/burion-logo-gold.webp', 'logo'],
            ['assets/brand/burion-logo-mark.png', 'assets/brand/burion-logo-mark.webp', 'logo']
          ];

          (async () => {
            for (const [src, dst, kind] of files) {
              if (!fs.existsSync(src)) continue;

              const image = sharp(src);
              if (kind === 'hero') {
                await image.webp({ quality: 80, effort: 6 }).toFile(dst);
              } else {
                await image.webp({ quality: 78, effort: 6, alphaQuality: 90 }).toFile(dst);
              }
            }
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Use WebP assets with original fallbacks
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          hero_old = 'src="assets/brand/burion-hero-lion.jpg" alt="Burion Studio lion"'
          hero_new = '<picture><source srcset="assets/brand/burion-hero-lion.webp" type="image/webp"><img src="assets/brand/burion-hero-lion.jpg" alt="Burion Studio lion"'
          if hero_old in s and '<picture><source srcset="assets/brand/burion-hero-lion.webp"' not in s:
              s = s.replace(hero_old, hero_new, 1)
              s = s.replace('fetchpriority="high" decoding="async"><div class="hero-image-overlay">', 'fetchpriority="high" decoding="async"></picture><div class="hero-image-overlay">', 1)

          s = s.replace(
              'href="assets/brand/burion-hero-lion.jpg" type="image/jpeg"',
              'href="assets/brand/burion-hero-lion.webp" type="image/webp"',
              1
          )

          for name in ['burion-logo-horizontal', 'burion-logo-gold', 'burion-logo-mark']:
              s = s.replace(
                  f'src="assets/brand/{name}.png"',
                  f'src="assets/brand/{name}.webp"'
              )

          p.write_text(s)
          PY

      - name: Commit optimized assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/brand/*.webp index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(images): optimize brand assets [skip ci]'
          git push
