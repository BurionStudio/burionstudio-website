name: Site smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate HTML, local assets, SEO, and security policy
        run: node --test tests/site-smoke.test.mjs

      - name: Check JavaScript syntax
        run: |
          node --check worker.js
          node --check script.js
