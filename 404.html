<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#070809">
  <link rel="icon" type="image/png" href="assets/brand/burion-favicon.png">
  <link rel="apple-touch-icon" href="assets/brand/burion-app-icon.png">
  <title>404 — Burion Studio</title>
  <link rel="preload" as="font" href="assets/fonts/dm-sans-400.woff2" type="font/woff2" crossorigin>
  <link rel="preload" as="font" href="assets/fonts/playfair-display-600.woff2" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css?v=20260929-2">
  <style>
    :root{--bg:#070809;--text:#f4f1ea;--muted:#969a9d;--gold:#d7a957;--gold-light:#f1cc7b;--line:rgba(255,255,255,.09)}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    body{min-height:100vh;display:grid;place-items:center;padding:28px;overflow:hidden}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 40%,rgba(215,169,87,.09),transparent 38%)}
    main{position:relative;width:min(720px,100%);padding:54px 42px;border:1px solid var(--line);border-radius:22px;text-align:center;background:rgba(13,16,18,.72);box-shadow:0 30px 90px rgba(0,0,0,.45);backdrop-filter:blur(18px)}
    .mark{width:96px;height:96px;margin:0 auto 28px}.mark img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 28px rgba(215,169,87,.18))}
    .eyebrow{margin:0 0 14px;color:var(--gold);font-size:10px;font-weight:700;letter-spacing:.25em}
    h1{margin:0;font-size:clamp(68px,12vw,112px);line-height:.85;letter-spacing:-.07em}h1 em{color:var(--gold-light);font-family:"Playfair Display",Georgia,serif;font-style:normal;font-weight:600}
    p{max-width:470px;margin:28px auto 32px;color:var(--muted);font-size:14px;line-height:1.7}
    a{display:inline-flex;align-items:center;justify-content:space-between;gap:30px;min-width:190px;padding:14px 18px;border:1px solid var(--gold-light);border-radius:9px;background:linear-gradient(135deg,var(--gold-light),#b98740);color:#111;font-size:11px;font-weight:700;text-decoration:none;transition:transform .2s ease,box-shadow .2s ease}
    a:hover{transform:translateY(-2px);box-shadow:0 12px 35px rgba(215,169,87,.18)}a:focus-visible{outline:2px solid var(--gold-light);outline-offset:4px}
    @media(max-width:520px){body{padding:15px}main{padding:42px 22px;border-radius:17px}.mark{width:82px;height:82px}p{font-size:13px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
  </style>
</head>
<body>
  <main>
    <div class="mark"><img src="assets/brand/burion-logo-mark-192.webp" alt="Burion Studio"></div>
    <p class="eyebrow">BURION STUDIO</p>
    <h1>4<em>04.</em></h1>
    <p>The page you're looking for doesn't exist or may have moved. Let's get you back to the studio.</p>
    <a href="index.html"><span>Back to studio</span><span aria-hidden="true">→</span></a>
  </main>
</body>
</html>
